name: Sync Schemas to GCS

on:
  push:
    branches:
      - main
    paths:
      - 'schemas/**'
  pull_request:
    branches:
      - main
    paths:
      - 'schemas/**'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all files'
        required: false
        type: boolean
        default: false

env:
  SCHEMA_PATH: schemas
  GCS_BUCKET: ${{ secrets.GCS_BUCKET_NAME }}

jobs:
  validate:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli for JSON Schema validation
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON syntax
        run: |
          echo "Validating JSON syntax..."
          for file in ${{ env.SCHEMA_PATH }}/*.json; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              python3 -c "import json; json.load(open('$file'))" || exit 1
            fi
          done
          echo "All JSON files are syntactically valid!"

      - name: Check for required fields
        run: |
          echo "Checking required fields in schemas..."
          for file in ${{ env.SCHEMA_PATH }}/*.json; do
            if [ -f "$file" ] && [ "$(basename $file)" != "repo.json" ]; then
              # Check for event_name field
              if ! python3 -c "import json; d=json.load(open('$file')); assert 'event_name' in d, 'Missing event_name'" 2>/dev/null; then
                echo "Warning: $file might be missing event_name field"
              fi
            fi
          done
          echo "Schema field checks completed!"

  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changes.outputs.changed_files }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed schema files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_sync }}" = "true" ]; then
            # Force sync - include all files
            CHANGED_FILES=$(find ${{ env.SCHEMA_PATH }} -name "*.json" -type f | sort)
          else
            # Get changed files since last commit or between branches
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            else
              BASE_SHA="${{ github.event.before }}"
            fi

            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              # Initial commit or new branch - sync all
              CHANGED_FILES=$(find ${{ env.SCHEMA_PATH }} -name "*.json" -type f | sort)
            else
              # One path per line (file names may contain spaces); core.quotepath=false
              # keeps git from quoting names with non-ASCII characters.
              CHANGED_FILES=$(git -c core.quotepath=false diff --name-only $BASE_SHA ${{ github.sha }} -- '${{ env.SCHEMA_PATH }}/*.json')
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changed_files=" >> $GITHUB_OUTPUT
            echo "No schema changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            {
              echo "changed_files<<CHANGED_FILES_EOF"
              echo "$CHANGED_FILES"
              echo "CHANGED_FILES_EOF"
            } >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$CHANGED_FILES"
          fi

  sync-to-gcs:
    name: Sync to GCS
    needs: [validate, detect-changes]
    # Only main reaches GCS: the validator reads the bucket root, which is production.
    # Branches live on GitHub and go to production through a merged PR.
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync changed files to GCS
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
        run: |
          echo "Syncing to GCS bucket: ${{ env.GCS_BUCKET }}"
          echo "Files to sync:"
          echo "$CHANGED_FILES"

          # One path per line: file names can contain spaces
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            FILENAME=$(basename "$file")
            DEST="gs://${{ env.GCS_BUCKET }}/${FILENAME}"
            if [ -f "$file" ]; then
              echo "Uploading $file -> $DEST"
              gsutil cp "$file" "$DEST"
            elif [ "$FILENAME" != "repo.json" ]; then
              # File was removed from the repo - remove it from GCS as well
              echo "Deleting $DEST (removed from repo)"
              gsutil rm "$DEST" || echo "Already absent: $DEST"
            fi
          done <<< "$CHANGED_FILES"

      - name: Verify sync
        run: |
          echo "Listing schemas in GCS..."
          gsutil ls "gs://${{ env.GCS_BUCKET }}/*.json" || echo "No files found"

  notify-on-pr:
    name: PR Validation Summary
    needs: [validate, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
        with:
          script: |
            const hasChanges = '${{ needs.detect-changes.outputs.has_changes }}' === 'true';
            const changedFiles = (process.env.CHANGED_FILES || '').split('\n').map(f => f.trim()).filter(f => f);

            let body = '## Schema Validation Results\n\n';
            body += '### Status: All validations passed!\n\n';

            if (hasChanges) {
              body += '### Changed Schemas:\n';
              changedFiles.forEach(file => {
                body += `- \`${file}\`\n`;
              });
              body += '\n';
              body += '> These schemas will be synced to GCS when merged to main.\n';
            } else {
              body += '*No schema changes detected in this PR.*\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
